<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sistema de Auditoría de Inventario Fotográfico</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>📸 Sistema de Auditoría de Inventario Fotográfico</h1>

        <p>

            Evaluación Final POA

        </p>

    </header>

    <section class="card">

        <h2>

            Ingreso de Inventario

        </h2>

        <p>

            Digite la cantidad disponible de cada artículo.

        </p>

        <table>

            <thead>

                <tr>

                    <th>Código</th>

                    <th>Artículo</th>

                    <th>Stock Disponible</th>

                </tr>

            </thead>

            <tbody id="inventoryTable">

            </tbody>

        </table>

        <div class="buttons">

            <button id="generateReport">

                Generar Reporte

            </button>

            <button id="clearData">

                Limpiar

            </button>

        </div>

    </section>

    <section id="report"
             class="card hidden">

        <h2>

            Reporte General del Inventario

        </h2>

        <div id="reportContent">

        </div>

    </section>

    <section id="restock"
             class="card hidden">

        <h2>

            Artículos que necesitan reabastecimiento

        </h2>

        <div id="restockContent">

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
